services:
  - type: web
    name: hostel-maintenance
    runtime: node
    rootDir: hostel-maintenance
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@hostel.test
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
